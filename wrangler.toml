name = "new-file-transfer"
main = "worker.js"
# 与线上保持一致：日期固定 2021-11-02（行为不变），仅开 streams 构造函数开关。
# 大文件分片拼接依赖 new ReadableStream()，缺这个 flag 会报 Error 1101。
compatibility_date = "2021-11-02"
compatibility_flags = ["streams_enable_constructors"]

# R2 存储桶：WebDAV 与文件中转共用
# binding 名必须与 worker.js 里 CONFIG.BUCKET_NAME 一致（默认 "file-transfer"）
# 创建桶：wrangler r2 bucket create file-transfer
[[r2_buckets]]
binding = "file-transfer"
bucket_name = "file-transfer"

# KV：WebDAV LOCK/UNLOCK 锁表（可选，默认关闭）
# 不绑定也能正常同步，只是 LOCK 返回 405、OPTIONS 不声明 DAV: 2。
# 需要时执行：wrangler kv namespace create WEBDAV_LOCKS
# 再把返回的 id 填进来并取消下面三行注释。
# [[kv_namespaces]]
# binding = "WEBDAV_LOCKS"
# id = "你的_KV_NAMESPACE_ID"

[observability]
enabled = true
